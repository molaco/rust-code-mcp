[package]
name    = "rmc-server"
version = "0.1.0"
edition = "2024"

[features]
# CPU embeddings by default; opt into GPU with `--features cuda` (requires nvcc/CUDA toolkit).
default = []
cuda = ["rmc-engine/embeddings-cuda", "rmc-indexing/cuda"]
migraphx = ["rmc-engine/embeddings-migraphx", "rmc-indexing/migraphx"]
directml = ["rmc-engine/embeddings-directml", "rmc-indexing/directml"]
# Same switch as on the binary: when the global allocator is mimalloc,
# returning memory must go through `mi_collect`, not glibc `malloc_trim`
# (that would trim a foreign, nearly empty heap and look like a broken switch).
#
# `mimalloc` itself is here only for this crate's own test binary, which must
# run under the allocator it is built for (see the `#[global_allocator]` in
# `lib.rs`); the shipped binary sets its own.
mimalloc = ["dep:libmimalloc-sys", "dep:mimalloc"]

[dependencies]
# In-workspace dependencies
rmc-engine   = { path = "../rmc-engine", features = ["embeddings", "vector-store", "hybrid-search"] }
rmc-graph    = { path = "../rmc-graph", features = ["semantic-embeddings"] }
rmc-config   = { path = "../rmc-config" }
rmc-indexing = { path = "../rmc-indexing" }

# MCP and async runtime
rmcp  = { workspace = true }
tokio = { workspace = true }
# `FutureExt::catch_unwind`: the tool-call and sync-loop panic boundaries.
futures = { workspace = true }

# Search and indexing
tantivy = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Cross-platform config/data directories
directories = { workspace = true }

# CPU count detection
num_cpus = { workspace = true }

# Persisted hypergraph store (used by graph response helpers)
heed = { workspace = true }

# IDE integration for semantic analysis
ra_ap_ide           = { workspace = true }
ra_ap_ide_db        = { workspace = true }
"ra_ap_load-cargo"  = { workspace = true }
ra_ap_project_model = { workspace = true }
ra_ap_vfs           = { workspace = true }
ra_ap_intern        = { workspace = true }

# Returning free memory to the kernel: `malloc_trim` on glibc builds; and
# `mallinfo2`, which says how much of the heap is in use and how much is free.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

# The same return, but when the allocator is replaced by mimalloc; see the `mimalloc` feature.
[dependencies.libmimalloc-sys]
version = "0.1"
optional = true

[dependencies.mimalloc]
version = "0.1"
optional = true

[dev-dependencies]
ra_ap_syntax = { workspace = true }
# `heap_size::DefMapCensus`, for the def map composition probe.
ra_ap_hir_def = { workspace = true }
tempfile = "3"

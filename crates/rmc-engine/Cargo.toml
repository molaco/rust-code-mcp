[package]
name    = "rmc-engine"
version = "0.1.0"
edition = "2024"

[features]
default = ["core"]
core = []
embeddings = [
  "dep:reqwest",
  "dep:hf-hub",
  "dep:fastembed",
  "dep:tokenizers",
  "dep:tokio",
  "dep:futures",
  "dep:toml",
  "dep:fs2",
  # The VRAM ledger and the fastembed model cache find their directories with it.
  "dep:directories",
  "fastembed/hf-hub-native-tls",
  # Use ORT at build/link time instead of dlopening libonnxruntime.so at runtime.
  # Plain Cargo builds download the CPU ORT archive; Nix builds override this
  # with ORT_LIB_PATH/ORT_PREFER_DYNAMIC_LINK so the pinned Nix ORT is used.
  # WINDOWS-GNU: ort has no prebuilt for x86_64-pc-windows-gnu (pyke ships only msvc),
  # so here ORT is loaded dynamically (ORT_DYLIB_PATH) rather than linked at build time.
  "fastembed/ort-load-dynamic",
]
embeddings-cuda = [
  "embeddings",
  "dep:candle-core",
  "fastembed/qwen3",
  "fastembed/cuda",
]
# AMD GPU via the ONNX Runtime MIGraphX EP (measured on RX 7700 XT / gfx1101: ×32 vs
# CPU on BGE-small fp32, batch 32x512). The ROCm EP is NOT added here on purpose: it
# is deprecated in ORT, and system builds simply don't have it:
# libonnxruntime_providers_rocm.so is not shipped, only migraphx is.
#
# The feature is additive to `embeddings`: the CPU profile keeps working in the same
# build, GPU is a separate profile. The downloaded `ort-download-binaries` archive is
# not used in that case (load-dynamic loads the system library), but it does not
# get in the way either, so features stay additive, as cargo requires.
embeddings-migraphx = [
  "embeddings",
  "dep:ort",
  "ort/migraphx",
  # Compiled-kernel cache directory; see ensure_migraphx_kernel_cache().
  "dep:directories",
]
# AMD (and any other DX12) GPU on WINDOWS, via the DirectML EP.
#
# A separate feature rather than 'GPU in general', because MIGraphX does NOT exist on
# Windows: not all of the ROCm stack has been ported to Windows, MIGraphX is not part of
# the ported set (ROCm/TheRock#1912 is open), and the only AMD plugin EP for ORT
# that made it to Windows is DirectML. So this is not 'a second way to do the same', but
# the ONLY way to compute embeddings inside the tool on Windows.
#
# `fastembed/directml` is required, and not for the EP: through it the vendored fastembed
# recognizes DirectML in the provider list and disables memory pattern + parallel
# execution (init_session_builder), which the DirectML EP does not survive. Taking
# `ort/directml` without it means building a session that crashes or silently
# degrades, and not in this file.
embeddings-directml = [
  "embeddings",
  "dep:ort",
  "ort/directml",
  "fastembed/directml",
]
vector-store = [
  "embeddings",
  "dep:anyhow",
  "dep:lancedb",
  "dep:arrow-array",
  "dep:arrow-schema",
  "dep:async-trait",
  "dep:directories",
  "dep:futures",
  "dep:tokio",
]
hybrid-search = [
  "embeddings",
  "vector-store",
  "dep:anyhow",
  "dep:tokio",
]

[dependencies]
# parser/ — rust-analyzer syntax
ra_ap_syntax = { workspace = true }

# schema.rs — Tantivy schema definitions
tantivy = { workspace = true }

# chunker/ — semantic code chunking
serde = { workspace = true }
uuid  = { workspace = true }

# embeddings/ — providers, backends, profiles
reqwest     = { workspace = true, optional = true }
hf-hub      = { workspace = true, optional = true }
fastembed   = { workspace = true, optional = true }
ort         = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
tokenizers  = { workspace = true, optional = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tokio       = { workspace = true, optional = true }
futures     = { workspace = true, optional = true }
# embeddings/gpu_lock.rs — one process at a time on the GPU (flock).
fs2         = { workspace = true, optional = true }
toml        = { workspace = true, optional = true }

# vector_store/ — LanceDB-backed vector storage
lancedb      = { workspace = true, optional = true }
arrow-array  = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
async-trait  = { workspace = true, optional = true }
directories  = { workspace = true, optional = true }

# search/ — Tantivy BM25 + hybrid search
anyhow = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
